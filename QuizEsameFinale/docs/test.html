<body>

    <script>
                let quizData = [];
                let currentQuestionIndex = 0;
                let userAnswersMap = {};

                async function fetchQuestions() {
                    try {
                        const response = await fetch('/api/exam/questions');
                        if (!response.ok) {
                            const errData = await response.json();
                            throw new Error(errData.error || 'Failed to fetch questions from the server.');
                        }
                        quizData = await response.json();
                        if (quizData && quizData.length > 0) {
                            loadQuestion();
                        } else {
                            document.getElementById('questionTitle').innerText = 'No questions found in dataset.';
                        }
                    } catch (error) {
                        document.getElementById('questionCounter').innerText = 'Error';
                        document.getElementById('questionTitle').innerText = 'Error loading exam: ' + error.message;
                    }
                }

                function loadQuestion() {
                    if (!quizData || quizData.length === 0) return;
                    const q = quizData[currentQuestionIndex];

                    document.getElementById('questionCounter').innerText = `${currentQuestionIndex + 1}/${quizData.length}`;
                    document.getElementById('rowBadge').innerText = `CSV Row: ${q.id}`;
                    document.getElementById('questionTitle').innerHTML = `<strong>${q.question}</strong>`;

                    for (let i = 0; i < 4; i++) {
                        const btn = document.getElementById(`opt${i}`);
                        const optionText = q.options[i] || '';
                        btn.innerText = optionText;

                        if (userAnswersMap[q.id] === optionText) {
                            btn.classList.add('selected');
                            btn.classList.remove('btn-outline-light');
                        } else {
                            btn.classList.remove('selected');
                            btn.classList.add('btn-outline-light');
                        }
                    }

                    document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
                    document.getElementById('nextBtn').innerText = currentQuestionIndex === quizData.length - 1 ? 'Finish' : 'Next';
                }

                function selectOption(optionIndex) {
                    if (!quizData || quizData.length === 0) return;
                    const q = quizData[currentQuestionIndex];
                    const selectedText = q.options[optionIndex];

                    userAnswersMap[q.id] = selectedText;
                    loadQuestion();
                }

                async function nextQuestion() {
                    if (currentQuestionIndex < quizData.length - 1) {
                        currentQuestionIndex++;
                        loadQuestion();
                    } else {
                        await submitExam();
                    }
                }

                function prevQuestion() {
                    if (currentQuestionIndex > 0) {
                        currentQuestionIndex--;
                        loadQuestion();
                    }
                }

                async function submitExam() {
                    const submissionPayload = quizData.map(q => ({
                        questionId: q.id,
                        selectedOption: userAnswersMap[q.id] || ""
                    }));

                    document.getElementById('rowBadge').style.display = 'none';
                    document.getElementById('questionTitle').innerText = 'Evaluating exam results...';
                    document.getElementById('quizInterface').classList.add('d-none');

                    try {
                        const response = await fetch('/api/exam/submit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(submissionPayload)
                        });

                        if (!response.ok) {
                            throw new Error('Failed to submit exam answers.');
                        }

                        const result = await response.json();
                        renderResults(result);
                    } catch (error) {
                        alert('Submission error: ' + error.message);
                        document.getElementById('rowBadge').style.display = 'block';
                        document.getElementById('quizInterface').classList.remove('d-none');
                        loadQuestion();
                    }
                }

                renderResults = function(result) {
                    document.getElementById('resultInterface').classList.remove('d-none');

                    const summaryText = `Total Questions: ${result.total} | Correct Answers: <span style="color: #0d6efd;">${result.correct}</span> | Wrong Answers: <span style="color: #dc3545;">${result.wrong}</span>`;
                    document.getElementById('scoreSummary').innerHTML = summaryText;

                    const container = document.getElementById('mistakesContainer');
                    container.innerHTML = '';

                    if (result.mistakes.length === 0) {
                        container.innerHTML = '<p class="text-success text-center">Congratulations! You answered all questions correctly!</p>';
                        return;
                    }

                    result.mistakes.forEach((m, idx) => {
                        const item = document.createElement('div');
                        item.className = 'mb-3 p-3 rounded border border-secondary';
                        item.style.backgroundColor = '#051c33';
                        item.innerHTML = `
                            <p><strong>#${idx + 1}. ${m.question}</strong></p>
                            <p class="mb-1 text-danger">Your Answer: ${m.userAnswer}</p>
                            <p class="mb-0 text-success">Correct Answer: ${m.correctAnswer}</p>
                        `;
                        container.appendChild(item);
                    });
                }

                window.onload = function() {
                    fetchQuestions();
                };
    </script>
